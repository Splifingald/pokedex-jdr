<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Demi-cercle rouge (haut) -->
  <rect x="0" y="0" width="32" height="16" fill="#DC0A2D" rx="16"/>

  <!-- Demi-cercle blanc (bas) -->
  <rect x="0" y="16" width="32" height="16" fill="#FFFFFF" rx="16"/>

  <!-- Ligne noire horizontale (séparation) -->
  <rect x="0" y="15" width="32" height="2" fill="#000000"/>

  <!-- Cercle blanc intérieur (haut) -->
  <circle cx="16" cy="8" r="3" fill="#FFFFFF"/>

  <!-- Cercle blanc intérieur (bas) -->
  <circle cx="16" cy="24" r="3" fill="#FFFFFF"/>

  <!-- Centre noir (petit point) -->
  <circle cx="16" cy="16" r="2" fill="#000000"/>

  <!-- Contour noir extérieur -->
  <circle cx="16" cy="16" r="16" fill="none" stroke="#000000" stroke-width="1"/>
</svg>
